    <rect x="330" y="452" width="290" height="48" rx="9" fill="#ffffff" stroke="#34d399" filter="url(#shadow)"/>
    <text x="342" y="472" font-size="13.5" font-weight="600" fill="#0f172a">fetch_external_data</text>
    <text x="342" y="489" font-size="10.5" fill="#64748b">读取 CSV 使用记录</text>
