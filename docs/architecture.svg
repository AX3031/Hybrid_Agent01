    <text x="494" y="664" font-size="10.5" fill="#64748b">load_document() / get_retriever()</text>
    <rect x="892" y="600" width="224" height="82" rx="9" fill="#ffffff" stroke="#fb923c" filter="url(#shadow)"/>
    <text x="906" y="624" font-size="13.5" font-weight="700" fill="#0f172a">Prompt Loader</text>
    <text x="906" y="646" font-size="10.5" fill="#475569">utils/prompt_loader.py</text>
    <text x="906" y="664" font-size="10.5" fill="#64748b">main / rag / report</text>

    <path d="M64 412 H48 V620 H64" fill="none" stroke="#475569" stroke-width="1.8" marker-end="url(#arrow)"/>
    <path d="M454 641 H478" fill="none" stroke="#475569" stroke-width="1.8" marker-end="url(#arrow)"/>

