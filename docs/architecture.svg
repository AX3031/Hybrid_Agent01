    <rect x="1210" y="146" width="332" height="58" rx="9" fill="#ffffff" stroke="#f9a8d4"/>
    <text x="1224" y="166" font-size="13" font-weight="700" fill="#0f172a">config/*.yml</text>
    <text x="1224" y="184" font-size="10.5" fill="#64748b">model / agent / prompts（含 workspace_roots）</text>

    <rect x="1210" y="218" width="332" height="58" rx="9" fill="#ffffff" stroke="#f9a8d4"/>
