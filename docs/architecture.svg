    <rect x="40" y="352" width="1120" height="194" rx="14" fill="#ecfdf5" stroke="#a7f3d0"/>
    <text x="56" y="374" font-size="12" font-weight="600" fill="#047857" letter-spacing="1.2">工具层 · TOOLS（8 个 @tool 注册，模型按需调用）</text>
    <text x="64" y="530" font-size="10.5" fill="#047857">另有 web_search_baidu：百度联网搜索，解析 web / image / video 结果</text>

    <rect x="64" y="388" width="250" height="48" rx="9" fill="#ffffff" stroke="#34d399" filter="url(#shadow)"/>
    <text x="76" y="408" font-size="13.5" font-weight="600" fill="#0f172a">rag_summarize</text>
    <text x="76" y="425" font-size="10.5" fill="#64748b">向量库检索 + 总结</text>
    <rect x="330" y="388" width="250" height="48" rx="9" fill="#ffffff" stroke="#34d399" filter="url(#shadow)"/>
    <text x="342" y="408" font-size="13.5" font-weight="600" fill="#0f172a">get_weather</text>
    <text x="342" y="425" font-size="10.5" fill="#64748b">天气（当前为模拟数据）</text>
    <rect x="596" y="388" width="250" height="48" rx="9" fill="#ffffff" stroke="#34d399" filter="url(#shadow)"/>
    <text x="608" y="408" font-size="13.5" font-weight="600" fill="#0f172a">get_user_location</text>
