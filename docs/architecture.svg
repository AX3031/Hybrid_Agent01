    <rect x="888" y="138" width="236" height="40" rx="9" fill="#ffffff" stroke="#93c5fd" filter="url(#shadow)"/>
    <text x="1006" y="163" font-size="14" fill="#0f172a" text-anchor="middle">浏览器 / 用户</text>
    <rect x="64" y="138" width="430" height="40" rx="9" fill="#ffffff" stroke="#60a5fa" filter="url(#shadow)"/>
    <text x="279" y="163" font-size="14" font-weight="600" fill="#0f172a" text-anchor="middle">app.py · Streamlit 对话界面（含工作区域设置）</text>
    <rect x="514" y="138" width="340" height="40" rx="9" fill="#f8fafc" stroke="#cbd5e1" stroke-dasharray="5 4"/>
    <text x="684" y="163" font-size="12.5" fill="#64748b" text-anchor="middle">app_file_uploader.py · 预留上传入口</text>
    <path d="M888 158 H860 V132 H502 V158 H494" fill="none" stroke="#475569" stroke-width="1.8" marker-end="url(#arrow)"/>
    <text x="680" y="126" font-size="11" fill="#64748b" text-anchor="middle">输入 / 流式输出</text>

    <!-- Orchestration layer -->
    <rect x="40" y="208" width="1120" height="124" rx="14" fill="#f5f3ff" stroke="#ddd6fe"/>
    <text x="56" y="230" font-size="12" font-weight="600" fill="#6d28d9" letter-spacing="1.2">智能体编排层 · ORCHESTRATION</text>
    <rect x="64" y="240" width="330" height="76" rx="10" fill="#ffffff" stroke="#8b5cf6" filter="url(#shadow)"/>
    <text x="80" y="266" font-size="16" font-weight="700" fill="#0f172a">ReactAgent</text>
    <text x="80" y="288" font-size="11.5" fill="#475569">create_agent() → CompiledStateGraph</text>
    <text x="80" y="306" font-size="11.5" fill="#475569">execute_stream / resume_stream</text>

    <rect x="420" y="232" width="700" height="92" rx="10" fill="#ffffff" stroke="#c4b5fd"/>
    <text x="436" y="252" font-size="12.5" font-weight="700" fill="#5b21b6">Agent Middleware（LangChain 中间件）</text>
    <rect x="436" y="264" width="200" height="44" rx="8" fill="#faf5ff" stroke="#d8b4fe"/>
    <text x="446" y="283" font-size="12" font-weight="600" fill="#0f172a">monitor_tool</text>
    <text x="446" y="299" font-size="10.5" fill="#64748b">工具日志 / 场景标记</text>
    <rect x="650" y="264" width="200" height="44" rx="8" fill="#faf5ff" stroke="#d8b4fe"/>
    <text x="660" y="283" font-size="12" font-weight="600" fill="#0f172a">log_before_model</text>
    <text x="660" y="299" font-size="10.5" fill="#64748b">模型调用前状态日志</text>
    <rect x="864" y="264" width="240" height="44" rx="8" fill="#faf5ff" stroke="#d8b4fe"/>
    <text x="874" y="283" font-size="12" font-weight="600" fill="#0f172a">report_prompt_switch</text>
    <text x="874" y="299" font-size="10.5" fill="#64748b">按 context 切换系统提示词</text>
    <text x="436" y="318" font-size="10.5" fill="#5b21b6">+ 守卫层（自动快速卡 + 子目标拆分 / 可选机器判据 / 只读 / 批次回滚 + 回滚边界 / 预算急停 / 原地打转拦截 / PIN 验签） · 任务技能库（子目标/匹配/步骤） · ToolError · ToolRetry · 结果校验 · 会话自愈 · 截图历史裁剪 · PII · ModelFallback · HITL · ToolCallLimit（100 步兜底）</text>

    <path d="M310 178 V240" fill="none" stroke="#475569" stroke-width="1.8" marker-end="url(#arrow)"/>
    <path d="M394 278 H420" fill="none" stroke="#475569" stroke-width="1.8" marker-end="url(#arrow)"/>

    <!-- Tool layer -->
    <rect x="40" y="352" width="1120" height="194" rx="14" fill="#ecfdf5" stroke="#a7f3d0"/>
    <text x="56" y="374" font-size="12" font-weight="600" fill="#047857" letter-spacing="1.2">工具层 · TOOLS（21 个 @tool；文件类受工作区限制，桌面类受确认/黑名单约束）</text>
    <text x="64" y="521" font-size="10.5" fill="#047857">桌面控制：computer_use（1 个工具 / 26 动作；控件级 UIA + 系统 OCR + OmniPilot 键鼠/截图/剪贴板/应用）</text>
    <text x="64" y="537" font-size="10.5" fill="#047857">另有 run_command / move_path / copy_path / create_directory / open_path（需确认）；删除默认进 .agent_trash；桌面只读动作直接执行，其余需确认</text>

    <rect x="64" y="388" width="250" height="48" rx="9" fill="#ffffff" stroke="#34d399" filter="url(#shadow)"/>
    <text x="76" y="408" font-size="13.5" font-weight="600" fill="#0f172a">get_system_info</text>
    <text x="76" y="425" font-size="10.5" fill="#64748b">系统 / 内存 / 磁盘</text>
    <rect x="330" y="388" width="250" height="48" rx="9" fill="#ffffff" stroke="#34d399" filter="url(#shadow)"/>
    <text x="342" y="408" font-size="13.5" font-weight="600" fill="#0f172a">list_directory</text>
    <text x="342" y="425" font-size="10.5" fill="#64748b">列目录 / 文件大小</text>
    <rect x="596" y="388" width="250" height="48" rx="9" fill="#ffffff" stroke="#34d399" filter="url(#shadow)"/>
    <text x="608" y="408" font-size="13.5" font-weight="600" fill="#0f172a">read_text_file</text>
    <text x="608" y="425" font-size="10.5" fill="#64748b">读取文本（分段）</text>
    <rect x="862" y="388" width="250" height="48" rx="9" fill="#ffffff" stroke="#34d399" filter="url(#shadow)"/>
    <text x="874" y="408" font-size="13.5" font-weight="600" fill="#0f172a">search_files</text>
    <text x="874" y="425" font-size="10.5" fill="#64748b">按文件名搜索</text>

    <rect x="64" y="452" width="250" height="48" rx="9" fill="#ffffff" stroke="#34d399" filter="url(#shadow)"/>
    <text x="76" y="472" font-size="13.5" font-weight="600" fill="#0f172a">search_text</text>
    <text x="76" y="489" font-size="10.5" fill="#64748b">按内容搜索</text>
    <rect x="330" y="452" width="250" height="48" rx="9" fill="#ffffff" stroke="#34d399" filter="url(#shadow)"/>
    <text x="342" y="472" font-size="13.5" font-weight="600" fill="#0f172a">list_processes</text>
    <text x="342" y="489" font-size="10.5" fill="#64748b">进程 / 内存占用</text>
    <rect x="596" y="452" width="250" height="48" rx="9" fill="#ffffff" stroke="#f472b6" filter="url(#shadow)"/>
    <text x="608" y="472" font-size="13.5" font-weight="600" fill="#0f172a">write_text_file</text>
    <text x="608" y="489" font-size="10.5" fill="#64748b">写文件（需确认）</text>
    <rect x="862" y="452" width="250" height="48" rx="9" fill="#ffffff" stroke="#f472b6" filter="url(#shadow)"/>
    <text x="874" y="472" font-size="13.5" font-weight="600" fill="#0f172a">delete_path</text>
    <text x="874" y="489" font-size="10.5" fill="#64748b">删除（需确认）</text>

    <path d="M229 316 V352" fill="none" stroke="#475569" stroke-width="1.8" marker-end="url(#arrow)"/>

    <!-- Service layer -->
    <rect x="40" y="566" width="1120" height="132" rx="14" fill="#fff7ed" stroke="#fed7aa"/>
    <text x="56" y="588" font-size="12" font-weight="600" fill="#c2410c" letter-spacing="1.2">安全与提示词服务 · SAFETY / PROMPTS</text>
    <rect x="64" y="600" width="390" height="82" rx="9" fill="#ffffff" stroke="#fb923c" filter="url(#shadow)"/>
    <text x="80" y="624" font-size="14" font-weight="700" fill="#0f172a">HumanInTheLoopMiddleware</text>
    <text x="80" y="646" font-size="10.5" fill="#475569">interrupt_on → interrupt() → Command(resume=...)</text>
    <text x="80" y="664" font-size="10.5" fill="#64748b">小白化确认卡片 + 影响范围</text>
    <rect x="478" y="600" width="390" height="82" rx="9" fill="#ffffff" stroke="#fb923c" filter="url(#shadow)"/>
    <text x="494" y="624" font-size="14" font-weight="700" fill="#0f172a">AgentEvent 事件流</text>
    <text x="494" y="646" font-size="10.5" fill="#475569">text / interrupt / tool 三类事件</text>
    <text x="494" y="664" font-size="10.5" fill="#64748b">操作记录 + 审计留痕</text>
    <rect x="892" y="600" width="224" height="82" rx="9" fill="#ffffff" stroke="#fb923c" filter="url(#shadow)"/>
    <text x="906" y="624" font-size="13.5" font-weight="700" fill="#0f172a">safety.py 安全策略</text>
    <text x="906" y="646" font-size="10.5" fill="#475569">工作区 / 敏感目录</text>
    <text x="906" y="664" font-size="10.5" fill="#64748b">命令拦截 / 回收区 / 备份</text>

    <path d="M64 412 H48 V620 H64" fill="none" stroke="#475569" stroke-width="1.8" marker-end="url(#arrow)"/>
    <path d="M454 641 H478" fill="none" stroke="#475569" stroke-width="1.8" marker-end="url(#arrow)"/>

    <!-- Model and storage layer -->
    <rect x="40" y="714" width="1120" height="176" rx="14" fill="#f8fafc" stroke="#cbd5e1"/>
    <text x="56" y="736" font-size="12" font-weight="600" fill="#334155" letter-spacing="1.2">模型与存储层 · MODELS / STORAGE</text>
    <rect x="64" y="746" width="280" height="72" rx="9" fill="#ffffff" stroke="#94a3b8" filter="url(#shadow)"/>
