    <text x="648" y="472" font-size="13.5" font-weight="600" fill="#0f172a">fill_context_for_report</text>
    <text x="648" y="489" font-size="10.5" fill="#64748b">场景开关：触发报告提示词</text>

    <path d="M229 316 V352" fill="none" stroke="#475569" stroke-width="1.8" marker-end="url(#arrow)"/>

    <!-- Service layer -->
    <rect x="40" y="566" width="1120" height="132" rx="14" fill="#fff7ed" stroke="#fed7aa"/>
    <text x="56" y="588" font-size="12" font-weight="600" fill="#c2410c" letter-spacing="1.2">核心服务层 · SERVICES</text>
    <rect x="64" y="600" width="390" height="82" rx="9" fill="#ffffff" stroke="#fb923c" filter="url(#shadow)"/>
    <text x="80" y="624" font-size="14" font-weight="700" fill="#0f172a">RagSummarizeService</text>
    <text x="80" y="646" font-size="10.5" fill="#475569">retriever → PromptTemplate → ChatModel → StrOutputParser</text>
    <text x="80" y="664" font-size="10.5" fill="#64748b">rag_summarize(query) 的完整链路</text>
    <rect x="478" y="600" width="390" height="82" rx="9" fill="#ffffff" stroke="#fb923c" filter="url(#shadow)"/>
    <text x="494" y="624" font-size="14" font-weight="700" fill="#0f172a">VectorStoreService</text>
