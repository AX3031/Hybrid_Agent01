<svg xmlns="http://www.w3.org/2000/svg" width="1600" height="1040" viewBox="0 0 1600 1040" role="img" aria-labelledby="archTitle archDesc">
  <title id="archTitle">机器人智能客服 Agent 系统架构总览</title>
  <desc id="archDesc">分层架构：Streamlit 表现层、LangChain create_agent 编排层、工具层、RAG 服务层、模型与存储层，以及右侧配置与基础设施。</desc>
  <defs>
    <marker id="arrow" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto">
      <path d="M 0 0 L 10 5 L 0 10 z" fill="#475569"/>
    </marker>
    <marker id="arrowDash" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto">
      <path d="M 0 0 L 10 5 L 0 10 z" fill="#db2777"/>
    </marker>
    <filter id="shadow" x="-10%" y="-10%" width="120%" height="120%">
      <feDropShadow dx="0" dy="2" stdDeviation="3" flood-color="#0f172a" flood-opacity="0.08"/>
    </filter>
  </defs>

  <rect width="1600" height="1040" fill="#f8fafc"/>

  <g font-family="Microsoft YaHei, PingFang SC, Segoe UI, sans-serif">
    <text x="48" y="52" font-size="30" font-weight="700" fill="#0f172a">机器人智能客服 Agent · 系统架构总览</text>
    <text x="48" y="80" font-size="15" fill="#64748b">LangChain 1.4 create_agent + init_chat_model（LangGraph）· DashScope 模型 · Chroma RAG · Streamlit UI</text>

    <!-- Presentation layer -->
    <rect x="40" y="104" width="1120" height="88" rx="14" fill="#eff6ff" stroke="#bfdbfe"/>
    <text x="56" y="126" font-size="12" font-weight="600" fill="#1d4ed8" letter-spacing="1.2">表现层 · PRESENTATION</text>
    <rect x="888" y="138" width="236" height="40" rx="9" fill="#ffffff" stroke="#93c5fd" filter="url(#shadow)"/>
    <text x="1006" y="163" font-size="14" fill="#0f172a" text-anchor="middle">浏览器 / 用户</text>
    <rect x="64" y="138" width="430" height="40" rx="9" fill="#ffffff" stroke="#60a5fa" filter="url(#shadow)"/>
    <text x="279" y="163" font-size="14" font-weight="600" fill="#0f172a" text-anchor="middle">app.py · Streamlit 对话界面</text>
    <rect x="514" y="138" width="340" height="40" rx="9" fill="#f8fafc" stroke="#cbd5e1" stroke-dasharray="5 4"/>
    <text x="684" y="163" font-size="12.5" fill="#64748b" text-anchor="middle">app_file_uploader.py · 预留上传入口</text>
    <path d="M888 158 H860 V132 H502 V158 H494" fill="none" stroke="#475569" stroke-width="1.8" marker-end="url(#arrow)"/>
    <text x="680" y="126" font-size="11" fill="#64748b" text-anchor="middle">输入 / 流式输出</text>

