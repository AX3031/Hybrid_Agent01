    <text x="384" y="806" font-size="10.5" fill="#64748b">文档 / 查询向量化</text>
    <rect x="676" y="746" width="280" height="72" rx="9" fill="#ffffff" stroke="#94a3b8" filter="url(#shadow)"/>
    <text x="690" y="770" font-size="13.5" font-weight="700" fill="#0f172a">Chroma</text>
    <text x="690" y="790" font-size="10.5" fill="#475569">collection = agent</text>
    <text x="690" y="806" font-size="10.5" fill="#64748b">persist = chroma_db/</text>
    <rect x="982" y="746" width="150" height="72" rx="9" fill="#ffffff" stroke="#94a3b8" filter="url(#shadow)"/>
    <text x="994" y="770" font-size="13.5" font-weight="700" fill="#0f172a">本地文件</text>
    <text x="994" y="790" font-size="10.5" fill="#475569">data/ · md5.text</text>
    <text x="994" y="806" font-size="10.5" fill="#64748b">原始资料 / 去重清单</text>

    <path d="M330 682 V746" fill="none" stroke="#475569" stroke-width="1.8" marker-end="url(#arrow)"/>
    <path d="M560 682 V746" fill="none" stroke="#475569" stroke-width="1.8" marker-end="url(#arrow)"/>
    <path d="M800 682 V746" fill="none" stroke="#475569" stroke-width="1.8" marker-end="url(#arrow)"/>

    <text x="64" y="852" font-size="10.5" fill="#64748b">向量库示例数据：3 个 chunk；切分 chunk_size=200 / overlap=20；日志：logs/agent_YYYYMMDD.log（控制台 INFO / 文件 DEBUG）</text>
    <text x="64" y="870" font-size="10.5" fill="#64748b">会话记忆在输入框左侧按钮切换：短期记忆（默认）/ 本地 JSON / PostgreSQL；侧边栏管理会话 ID。</text>

    <!-- Prompt switch (dashed) -->
    <path d="M1116 620 H1148 V288 H1104" fill="none" stroke="#db2777" stroke-width="1.6" stroke-dasharray="6 5" marker-end="url(#arrowDash)"/>

