    <rect x="40" y="208" width="1120" height="124" rx="14" fill="#f5f3ff" stroke="#ddd6fe"/>
    <text x="56" y="230" font-size="12" font-weight="600" fill="#6d28d9" letter-spacing="1.2">智能体编排层 · ORCHESTRATION</text>
    <rect x="64" y="240" width="330" height="76" rx="10" fill="#ffffff" stroke="#8b5cf6" filter="url(#shadow)"/>
    <text x="80" y="266" font-size="16" font-weight="700" fill="#0f172a">ReactAgent</text>
    <text x="80" y="288" font-size="11.5" fill="#475569">create_agent() → CompiledStateGraph</text>
    <text x="80" y="306" font-size="11.5" fill="#475569">execute_stream(query)</text>

    <rect x="420" y="232" width="700" height="92" rx="10" fill="#ffffff" stroke="#c4b5fd"/>
    <text x="436" y="252" font-size="12.5" font-weight="700" fill="#5b21b6">Agent Middleware（LangChain 中间件）</text>
    <rect x="436" y="264" width="200" height="44" rx="8" fill="#faf5ff" stroke="#d8b4fe"/>
    <text x="446" y="283" font-size="12" font-weight="600" fill="#0f172a">monitor_tool</text>
    <text x="446" y="299" font-size="10.5" fill="#64748b">工具日志 / 场景标记</text>
    <rect x="650" y="264" width="200" height="44" rx="8" fill="#faf5ff" stroke="#d8b4fe"/>
    <text x="660" y="283" font-size="12" font-weight="600" fill="#0f172a">log_before_model</text>
    <text x="660" y="299" font-size="10.5" fill="#64748b">模型调用前状态日志</text>
    <rect x="864" y="264" width="240" height="44" rx="8" fill="#faf5ff" stroke="#d8b4fe"/>
    <text x="874" y="283" font-size="12" font-weight="600" fill="#0f172a">report_prompt_switch</text>
    <text x="874" y="299" font-size="10.5" fill="#64748b">按 context 切换系统提示词</text>
    <text x="436" y="318" font-size="10.5" fill="#5b21b6">+ PIIMiddleware（邮箱 redact / 手机号 mask） · ModelFallbackMiddleware（主模型失败切备用）</text>

    <path d="M310 178 V240" fill="none" stroke="#475569" stroke-width="1.8" marker-end="url(#arrow)"/>
    <path d="M394 278 H420" fill="none" stroke="#475569" stroke-width="1.8" marker-end="url(#arrow)"/>

