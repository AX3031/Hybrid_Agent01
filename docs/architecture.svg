<svg xmlns="http://www.w3.org/2000/svg" width="1600" height="1040" viewBox="0 0 1600 1040" role="img" aria-labelledby="archTitle archDesc">
  <title id="archTitle">本地电脑助手 Agent 系统架构总览</title>
  <desc id="archDesc">分层架构：Streamlit 表现层、LangChain create_agent 编排层、电脑操作工具层、安全与提示词服务层、模型与存储层，以及右侧配置与基础设施。</desc>
  <defs>
    <marker id="arrow" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto">
      <path d="M 0 0 L 10 5 L 0 10 z" fill="#475569"/>
    </marker>
    <marker id="arrowDash" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto">
      <path d="M 0 0 L 10 5 L 0 10 z" fill="#db2777"/>
    </marker>
    <filter id="shadow" x="-10%" y="-10%" width="120%" height="120%">
      <feDropShadow dx="0" dy="2" stdDeviation="3" flood-color="#0f172a" flood-opacity="0.08"/>
    </filter>
  </defs>

  <rect width="1600" height="1040" fill="#f8fafc"/>

  <g font-family="Microsoft YaHei, PingFang SC, Segoe UI, sans-serif">
    <text x="48" y="52" font-size="30" font-weight="700" fill="#0f172a">本地电脑助手 Agent · 系统架构总览</text>
    <text x="48" y="80" font-size="15" fill="#64748b">LangChain 1.4 create_agent + init_chat_model（LangGraph）· 工作区域与人工确认 · 小企业版 P0 守卫层 · 任务技能库 · 文件系统 / psutil / OmniPilot 工具层 · Streamlit UI</text>

