    <text x="1224" y="328" font-size="10.5" fill="#64748b">模型 Key 与 Base URL（不入 Git）</text>

    <rect x="1210" y="362" width="332" height="58" rx="9" fill="#ffffff" stroke="#f9a8d4"/>
    <text x="1224" y="382" font-size="13" font-weight="700" fill="#0f172a">utils/*.py</text>
    <text x="1224" y="400" font-size="10.5" fill="#64748b">config / path / file / logger / prompt</text>

    <rect x="1210" y="434" width="332" height="58" rx="9" fill="#ffffff" stroke="#f9a8d4"/>
    <text x="1224" y="454" font-size="13" font-weight="700" fill="#0f172a">logs/</text>
    <text x="1224" y="472" font-size="10.5" fill="#64748b">agent_YYYYMMDD.log</text>

    <rect x="1210" y="506" width="332" height="58" rx="9" fill="#ffffff" stroke="#f9a8d4"/>
    <text x="1224" y="526" font-size="13" font-weight="700" fill="#0f172a">env_patch/</text>
    <text x="1224" y="544" font-size="10.5" fill="#64748b">project2_root.pth + sitecustomize.py</text>

    <rect x="1210" y="578" width="332" height="58" rx="9" fill="#ffffff" stroke="#f9a8d4"/>
    <text x="1224" y="598" font-size="13" font-weight="700" fill="#0f172a">data/external/records.csv</text>
    <text x="1224" y="616" font-size="10.5" fill="#64748b">外部使用记录（当前示例为空）</text>

    <rect x="1210" y="650" width="332" height="58" rx="9" fill="#ffffff" stroke="#f9a8d4"/>
    <text x="1224" y="670" font-size="13" font-weight="700" fill="#0f172a">memorys/chat_history/</text>
    <text x="1224" y="688" font-size="10.5" fill="#64748b">本地 JSON / 文件型会话历史（已接入）</text>

    <text x="1206" y="758" font-size="10.5" fill="#64748b">启动时读取配置；运行时写入日志、向量库与记忆文件。</text>
    <text x="1206" y="778" font-size="10.5" fill="#64748b">重建 .venv 后需重新复制 env_patch 到 site-packages。</text>
    <text x="1206" y="798" font-size="10.5" fill="#64748b">Agent 系统/报告提示词在每次模型调用前重读。</text>

